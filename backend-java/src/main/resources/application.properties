# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.address=0.0.0.0

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=fmgc-warehouse

# ─── DataSource (PostgreSQL) ───────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fmgcdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP connection pool ─────────────────────────────────────────────────
# Render free-tier PostgreSQL needs conservative pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1

# ─── SQL Initialisation ───────────────────────────────────────────────────────
# always: schema.sql and data.sql run on every startup
# Both scripts are fully idempotent:
#   schema.sql  → CREATE TABLE IF NOT EXISTS + DO $$...EXCEPTION blocks for indexes
#   data.sql    → INSERT ... ON CONFLICT (id) DO NOTHING
# continue-on-error=false so real problems surface immediately instead of being hidden
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
# false = real errors surface immediately (scripts are fully idempotent now)
# schema.sql uses CREATE TABLE IF NOT EXISTS + CREATE INDEX IF NOT EXISTS (no DO $$ blocks)
# data.sql uses INSERT ... ON CONFLICT (id) DO NOTHING
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8
# Spring Boot default separator is ";". Our scripts only use simple statements — no
# dollar-quoted procedural blocks — so the default separator works correctly.
spring.sql.init.separator=;

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dev-fallback-secret-change-in-production-min32chars}
jwt.expiration=${JWT_EXPIRES_IN:86400000}

# ─── Gemini AI ────────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}

# ─── CORS ─────────────────────────────────────────────────────────────────────
cors.origin=${CORS_ORIGIN:http://localhost:3000}

# ─── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=NON_NULL

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.fmgc=INFO
