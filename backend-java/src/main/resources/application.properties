server.port=${PORT:8080}
spring.application.name=fmgc-warehouse
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fmgcdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true
jwt.secret=${JWT_SECRET:dev-fallback-secret-change-in-production-min32chars}
jwt.expiration=${JWT_EXPIRES_IN:86400000}
gemini.api.key=${GEMINI_API_KEY:}
cors.origin=${CORS_ORIGIN:http://localhost:3000}
spring.jackson.default-property-inclusion=NON_NULL
